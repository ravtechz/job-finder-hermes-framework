<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Job Dashboard</title>
    <script>
      // tema se aplică înainte de prima afișare, ca să nu apară o clipire din tema greșită
      (function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('jd-theme'); if (t !== 'basic' && t !== 'synthwave') t = 'severance'
          d.dataset.theme = t
          if (t !== 'basic' || matchMedia('(prefers-color-scheme: dark)').matches) d.classList.add('dark')
        } catch (e) { d.dataset.theme = 'severance'; d.classList.add('dark') }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
